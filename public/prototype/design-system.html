<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="D3 Deep Dive Day – das digitale B2G-Event von Amtshelden. Mosaic Interface v5, interner Prototyp.">
<title>D3 Deep Dive Day · Mosaic Interface v5 (Prototyp)</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Martian+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>

body{margin:0}
:root{
/* Farbhierarchie – Basis: Bone, Tinte · Primär (Amtshelden-Brücke): Gelb, Grün · Tertiär, nur punktuell: Infrarot (--d3-orange), Purple */
--d3-bg:#EEEDE4;--d3-bg-2:#E3E2D7;--d3-white:#F8F7F2;--d3-black:#1E1B36;--d3-orange:#FF4B23;--d3-purple:#7861D7;--d3-yellow:#FFE500;--d3-green:#009460;
--d3-line:rgba(30,27,54,.14);--d3-mute:#56554F;
--f-text:'Archivo','Helvetica Neue',Arial,sans-serif;--f-sys:'Martian Mono',ui-monospace,monospace;--f-body:Georgia,'Times New Roman',serif;--f-wide:108%;
--motion-fast:.16s;--motion-ui:.3s;--motion-layout:.75s;--motion-in:.42s;
--ease-out:cubic-bezier(.2,.7,.1,1);--ease-io:cubic-bezier(.75,0,.2,1);
/* Text dockt oben (Label) oder unten (Inhalt) an – gleiche Werte in allen Zellen */
--cell-padding:18px;--label-position:var(--cell-padding);--content-baseline:var(--cell-padding);--meta-baseline:calc(var(--cell-padding) + 2px)}
.bp-tab{--cell-padding:16px}.bp-mob{--cell-padding:12px}
.evo{fill-rule:evenodd}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
a{color:inherit}
.sys{font-family:var(--f-sys);font-size:11px;letter-spacing:.05em;text-transform:uppercase;line-height:1.4}
.big{font-weight:850;font-stretch:var(--f-wide);letter-spacing:-.035em;line-height:.95;text-transform:uppercase;margin:0}
.app{position:relative;width:100%;height:100vh;overflow:hidden;background:var(--d3-bg);color:var(--d3-black);font-family:var(--f-text);display:grid;grid-template-rows:56px minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.app.bp-tab,.app.bp-mob{grid-template-rows:56px minmax(0,1fr) 60px}
/* top bar */
.bar{position:relative;z-index:20;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));border-bottom:1px solid var(--d3-black);background:var(--d3-bg)}
.bar > *{display:flex;align-items:center;padding:0 10px;border-right:1px solid var(--d3-line);min-width:0;text-decoration:none;white-space:nowrap;overflow:hidden}
.bar .nv{letter-spacing:.02em;transition:background var(--motion-fast),color var(--motion-fast)}
.bar .nv:hover{background:var(--d3-bg-2)}.bar .nv.on{background:var(--d3-yellow);color:var(--d3-black);box-shadow:inset 0 -3px 0 var(--d3-black)}
.lock{gap:10px}
.lock .by{font-weight:800;font-size:12px;letter-spacing:-.01em;margin-left:2px}
.bar .cta-b{background:var(--d3-green);color:var(--d3-white);justify-content:space-between;font-weight:800;font-size:14px;text-transform:uppercase;border-right:0}
.bp-tab .bar .nv,.bp-mob .bar .nv{display:none}
.bp-mob .bar .idx,.bp-mob .hide-mob-txt{display:none}.lock .only-mob{display:none}.bp-mob .lock .only-mob{display:block}
.bp-mob .bar .cta-b{font-size:12px;padding:0 10px}
.bot{display:none}
.bp-tab .bot,.bp-mob .bot{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--d3-black);background:var(--d3-bg);z-index:20}
.bot > *{display:flex;align-items:center;justify-content:center;border-right:1px solid var(--d3-line);text-decoration:none;font-size:11px;padding:0 4px;text-align:center}
.bot .on{background:var(--d3-yellow);color:var(--d3-black);box-shadow:inset 0 3px 0 var(--d3-black)}
/* stage */
.stage{position:relative;min-height:0;overflow-y:auto;overflow-x:hidden;container-type:size;scrollbar-width:thin}
.canvas{position:relative;--rowh:max(calc(100cqh / var(--base)),var(--minrow));height:calc(var(--rows) * var(--rowh));background-image:linear-gradient(90deg,var(--d3-line) 1px,transparent 1px),linear-gradient(var(--d3-line) 1px,transparent 1px);background-size:calc(100% / var(--cols)) var(--rowh)}
.mod{position:absolute;box-sizing:border-box;overflow:hidden;container-type:size;container-name:mod;transition:transform var(--motion-layout) var(--ease-out),left var(--motion-layout) var(--ease-io),top var(--motion-layout) var(--ease-io),width var(--motion-layout) var(--ease-io),height var(--motion-layout) var(--ease-io),opacity var(--motion-ui) var(--ease-out),visibility 0s linear 0s;box-shadow:inset 0 0 0 .5px var(--d3-line)}
.mod.off{opacity:0;visibility:hidden;pointer-events:none;transition:opacity var(--motion-fast) var(--ease-out),visibility 0s linear var(--motion-fast)}
.mod.act{cursor:pointer}
.dark{background:var(--d3-black);color:var(--d3-bg);--d3-mute:#B9B5CF;--d3-line:rgba(238,237,228,.16)}
.hit{position:absolute;inset:0;z-index:0}
.hit:focus-visible{outline:3px solid var(--d3-orange);outline-offset:-3px}
.L{position:absolute;inset:0;z-index:2;opacity:0;visibility:hidden;pointer-events:none;box-sizing:border-box;transition:opacity var(--motion-fast) var(--ease-out),visibility 0s linear var(--motion-fast)}
.L a,.L button,.L details,.L summary{pointer-events:auto}
.st-home .l-home,.st-explore .l-explore,.st-program .l-program,.st-speaker .l-speaker,.st-partner .l-partner,.l-all{opacity:1;visibility:visible;transition:opacity var(--motion-ui) var(--ease-out) var(--motion-in),visibility 0s linear 0s}
.pad{padding:var(--label-position) var(--cell-padding) var(--content-baseline)}
.fill{display:flex;flex-direction:column;justify-content:space-between;height:100%;box-sizing:border-box}
.end{display:flex;flex-direction:column;justify-content:flex-end;height:100%;box-sizing:border-box;gap:8px}
.p{margin:0;font-size:clamp(14px,4.2cqw,18px);line-height:1.38;max-width:34ch}
/* shapes */
.sh{position:absolute;z-index:1;display:block;translate:calc(var(--mx) * var(--dp,4px)) calc(var(--my) * var(--dp,4px));transition:left var(--motion-layout) var(--ease-io),top var(--motion-layout) var(--ease-io),width var(--motion-layout) var(--ease-io),height var(--motion-layout) var(--ease-io),rotate var(--motion-layout) var(--ease-io),translate .6s var(--ease-out)}

/* format modules: shape choreography by state (sizes from the module's own box) */
.fmt .sh{--s:min(56cqw,46cqh);width:var(--s);height:var(--s);left:calc(50% - var(--s) / 2);top:calc(50% - var(--s) / 2 - 5%)}
.st-explore .fmt .sh{--s:min(58cqw,62cqh);left:calc(100% - var(--s) * .86);top:calc(var(--s) * -.14)}
.st-explore .k-fk .sh{--s:min(80cqw,64cqh)}
.st-partner .k-fs .sh{--s:min(34cqw,52cqh);left:auto;right:7%;top:12%}
@container mod (max-height: 125px){ .fmt .sh{--s:min(40cqw,40cqh);top:calc(var(--cell-padding) - 2px)} .tB > .lab{display:none} }
@container mod (max-width: 150px){ .tB > .lab{display:none} .fmt .sh{--s:min(46cqw,40cqh);top:var(--cell-padding)} .tB .btm .lab{font-size:10px;letter-spacing:.02em} }
/* graphic-only */
/* portraits */
.pt{position:absolute;overflow:hidden;z-index:1;transition:all var(--motion-layout) var(--ease-io)}
.pt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.06)}
.m-circle{clip-path:circle(closest-side at 50% 50%)}
.m-cut{clip-path:polygon(0 0,100% 0,100% 70%,70% 100%,0 100%)}
.m-sq{}
.spk .pt{left:var(--cell-padding);right:var(--cell-padding);top:var(--cell-padding);bottom:calc(var(--cell-padding) + 44px);width:auto;height:auto}
.spk .nm{position:absolute;left:var(--cell-padding);right:var(--cell-padding);bottom:var(--content-baseline);display:flex;flex-direction:column;gap:2px;z-index:2}
.spk .nm b{font-size:clamp(13px,7cqw,17px);line-height:1.15}
.spk.sel{box-shadow:inset 0 0 0 3px var(--d3-black)}
.badge{position:absolute;right:6%;top:5%;width:24%;aspect-ratio:1/1;z-index:2}
.k-hero .msk{position:absolute;inset:0;overflow:hidden;z-index:1;clip-path:circle(0% at 50% 100%);transition:clip-path .55s cubic-bezier(.7,0,.2,1)}

@media (prefers-reduced-motion: reduce){ .mod,.sh,.k-hero .msk,.L{transition-duration:.01s !important;transition-delay:0s !important} }
@container mod (max-width: 560px){ .hide-w{display:none !important} }
.par-n{display:none}
/* program board */
.board{display:grid;grid-template-columns:clamp(220px,22cqw,300px) minmax(0,1fr);height:100%}
.b-side{display:flex;flex-direction:column;gap:18px;padding:22px 20px;border-right:1px solid var(--d3-black);overflow:auto;background:var(--d3-bg)}
.b-title{font-size:clamp(28px,2.6cqw,40px)}
.chips{display:flex;flex-direction:column;gap:2px}
.chip{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border:1px solid transparent;transition:background var(--motion-fast)}
.chip:hover{background:var(--d3-bg-2)}
.chip.on{background:var(--d3-black);color:var(--d3-bg)}
.chip .ic{position:relative;width:20px;height:20px;flex-shrink:0;color:var(--d3-black)}
.chip.on .ic{color:var(--d3-bg)}
.ic .sh{inset:0;width:100%;height:100%;translate:none;left:0;top:0}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{padding:7px 9px 6px;border:1px solid var(--d3-black);min-height:32px;box-sizing:border-box}
.tchip.on{background:var(--d3-black);color:var(--d3-bg)}

.xbtn{align-self:flex-end;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--d3-black);font-size:22px;flex-shrink:0}
.lnk{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:0 14px;border:1px solid var(--d3-black);text-decoration:none;font-weight:700}
.lnk:hover{background:var(--d3-black);color:var(--d3-bg)}
@container mod (max-width: 860px){
  .board{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .b-side{border-right:0;border-bottom:1px solid var(--d3-black);padding:14px 14px 12px;gap:10px}
  .b-side .p{display:none}
  .chips,.tchips{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .chip{flex-shrink:0;border:1px solid var(--d3-black)}
  .tchip{flex-shrink:0}
}

/* Programm als Tagesreise: Zeit läuft horizontal, Räume sind Bahnen. Steht ein Punkt allein, belegt er alle Bahnen (Plenum). */
.jr{--ppm:4px;--axh:30px;--gut:34px;position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--d3-bg)}
.j-now{display:grid;grid-template-columns:minmax(170px,.75fr) 1fr 1fr;border-bottom:1px solid var(--d3-black);flex-shrink:0}
.jn-clock{display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:12px 16px 12px;background:var(--d3-white);border-right:1px solid var(--d3-black)}
.jn-time{font-weight:850;font-stretch:var(--f-wide);font-size:clamp(30px,3.2cqw,46px);line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.jn-range{width:100%;margin:0;height:18px;accent-color:var(--d3-black);cursor:ew-resize}
.jn-c{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:8px;padding:12px 16px 14px;min-height:104px;min-width:0;border-right:1px solid var(--d3-black)}
.jn-c:last-child{border-right:0}
.jn-b{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:100%}
.jn-c b{font-size:clamp(17px,1.6cqw,22px);line-height:1.12;letter-spacing:-.01em;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jn-m{opacity:.75}
.jn-live{background:var(--d3-green);color:var(--d3-white)}
.jn-next{background:var(--d3-yellow);color:var(--d3-black)}
.jn-c.idle{background:var(--d3-bg-2);color:var(--d3-black);cursor:default}
.jn-c:not(.idle):hover b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.jn-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:8px;vertical-align:0;animation:jDot 1.6s steps(1,end) infinite}
.jn-c.idle .jn-dot{display:none}
@keyframes jDot{50%{opacity:.15}}
.j-body{flex:1;min-height:0;display:grid;grid-template-columns:var(--gut) minmax(0,1fr)}
.j-rooms{display:grid;grid-template-rows:repeat(4,minmax(0,1fr));padding-top:var(--axh);border-right:1px solid var(--d3-black);background:var(--d3-bg)}
.j-rooms span{writing-mode:vertical-rl;transform:rotate(180deg);text-align:right;padding:10px 0;margin:0 auto;font-size:10px;letter-spacing:.06em;white-space:nowrap;overflow:hidden}
.j-scroll{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:var(--d3-black) transparent}
.j-track{position:relative;height:100%;width:calc(390 * var(--ppm) + 28px);display:flex;flex-direction:column}
.j-axis{position:relative;height:var(--axh);flex-shrink:0;border-bottom:1px solid var(--d3-black);background:var(--d3-bg)}
.j-tk{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding-left:6px;border-left:1px solid var(--d3-black);font-size:11px;white-space:nowrap}
.j-tk.half{color:var(--d3-mute);border-left-color:var(--d3-line)}
.j-lanes{position:relative;flex:1;min-height:0;background-image:repeating-linear-gradient(90deg,var(--d3-line) 0 1px,transparent 1px calc(30 * var(--ppm))),linear-gradient(transparent calc(25% - 1px),var(--d3-line) calc(25% - 1px) 25%,transparent 25% calc(50% - 1px),var(--d3-line) calc(50% - 1px) 50%,transparent 50% calc(75% - 1px),var(--d3-line) calc(75% - 1px) 75%,transparent 75%)}
.jc{position:absolute;display:flex;flex-direction:column;justify-content:space-between;gap:6px;padding:10px 12px 12px;box-sizing:border-box;overflow:hidden;background:var(--d3-white);color:var(--d3-black);box-shadow:inset 0 0 0 1px var(--d3-black);transition:opacity var(--motion-ui) var(--ease-out),background var(--motion-fast)}
.jc:hover{background:var(--d3-bg-2)}
.jc .ci{position:relative;width:22px;height:22px;flex-shrink:0}
.jc .ci .sh,.jx-f .ci .sh{left:0;top:0;width:100%;height:100%;translate:none}
.jc-top{display:flex;align-items:center;gap:8px;width:100%;min-width:0}
.jc-btm{display:flex;flex-direction:column;gap:3px;min-width:0}
.jc b{font-size:15px;line-height:1.16;font-weight:750;hyphens:auto;overflow-wrap:break-word}
.jc-t{white-space:nowrap}
.jc .who{font-size:13px;opacity:.72}
.jc-f{opacity:.72}
.jc-live{margin-left:auto;padding:2px 6px 1px;background:var(--d3-green);color:var(--d3-white)}
.jc.f-keynote{background:var(--d3-black);color:var(--d3-bg)}
.jc.f-keynote:hover{background:#2D2950}
.jc.f-case,.jc.f-panel{background:var(--d3-bg-2)}
.jc.f-case:hover,.jc.f-panel:hover{background:#D8D7CB}
.jc.f-net{background:var(--d3-yellow)}
.jc.f-net:hover{background:#F2D900}
.jc.plen b{font-size:clamp(18px,1.8cqw,26px);font-stretch:var(--f-wide);font-weight:850;letter-spacing:-.02em;line-height:1;max-width:12ch}
.jc.plen .ci{width:clamp(30px,3.2cqw,48px);height:clamp(30px,3.2cqw,48px)}
.jc.thin{padding:10px 0;align-items:center}
.jc.thin .jc-t,.jc.thin .who,.jc.thin .jc-f,.jc.thin .jc-live{display:none}
.jc.thin .jc-top{justify-content:center}
.jc.thin .ci{width:18px;height:18px}
.jc.thin .jc-btm{writing-mode:vertical-rl;transform:rotate(180deg)}
.jc.thin b{font-size:14px;font-stretch:100%;max-width:none}
/* vorbei: nur noch Kontur, Farbe weicht */
.jc.past{background:var(--d3-bg);color:var(--d3-mute);box-shadow:inset 0 0 0 1px var(--d3-line)}
.jc.past:hover{background:var(--d3-bg-2)}
.jc.past .ci{filter:grayscale(1);opacity:.45}
.jc.live{box-shadow:inset 0 0 0 1px var(--d3-black),inset 0 5px 0 var(--d3-green)}
.jc.dim{opacity:.13}
.j-nowline{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--d3-green);z-index:4;pointer-events:none;transition:left .32s var(--ease-io)}
.j-nowline span{position:absolute;top:0;left:0;white-space:nowrap;padding:3px 6px 2px;background:var(--d3-green);color:var(--d3-white);font-size:10px}
/* Aufbau beim Betreten: Zellen wischen entlang der Zeitachse ein, dann fällt die Jetzt-Linie */
.st-program .jc{animation:jIn .5s cubic-bezier(.7,0,.2,1) both;animation-delay:calc(var(--i) * 42ms + 280ms)}
.st-program .j-nowline{animation:jLine .45s cubic-bezier(.7,0,.2,1) .95s both}
@keyframes jIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes jLine{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
/* Aufgeklappter Programmpunkt: wächst aus seiner Zelle (clip-path, per WAAPI) */
.j-exp{position:absolute;inset:0;z-index:8;visibility:hidden;background:var(--d3-yellow);color:var(--d3-black)}
.j-exp.open{visibility:visible}
.j-exp.tone-k{background:var(--d3-black);color:var(--d3-bg)}
.j-exp.tone-n{background:var(--d3-green);color:var(--d3-white)}
.jx-in{height:100%;overflow:auto;box-sizing:border-box;padding:var(--cell-padding) clamp(18px,3cqw,40px) clamp(18px,3cqw,32px);display:flex;flex-direction:column;gap:clamp(16px,2.6cqh,28px)}
.jx-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tone-k .xbtn,.tone-k .lnk,.tone-n .xbtn,.tone-n .lnk{border-color:currentColor}
.tone-k .lnk:hover{background:var(--d3-bg);color:var(--d3-black)}
.tone-n .lnk:hover{background:var(--d3-white);color:var(--d3-black)}
.jx-grid{flex:1;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(220px,1fr);gap:clamp(20px,4cqw,64px);align-items:end}
.jx-text{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.jx-f{display:flex;align-items:center;gap:10px}
.jx-f .ci{position:relative;width:36px;height:36px}
.jx-title{font-size:clamp(36px,min(6.4cqw,11cqh),104px);line-height:.92;max-width:13ch;text-wrap:balance;margin:0}
.jx-desc{font-size:clamp(16px,1.5cqw,20px);max-width:44ch}
.jx-tp{padding:3px 6px 2px;border:1px solid currentColor}
.jx-side{display:flex;flex-direction:column;gap:10px;min-width:0}
.jx-pt{position:relative;width:min(100%,36cqh);aspect-ratio:1/1;overflow:hidden}
.jx-pt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.06)}
.jx-who{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}
.jx-who span{opacity:.72;font-size:14px}
.jx-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@container mod (max-width: 860px){
  .jr{--ppm:3px;--axh:26px;--gut:26px}
  .j-now{grid-template-columns:1fr 1fr}
  .jn-clock{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;border-right:0;border-bottom:1px solid var(--d3-black);padding:8px 14px}
  .jn-clock .lab{flex-shrink:0}
  .jn-time{font-size:26px}
  .jn-c{min-height:84px;padding:10px 14px 12px}
  .jn-c b{font-size:16px}
  .jc{padding:8px 9px 10px}
  .jc b{font-size:13px}
  .jc .who{display:none}
  .jc-live{display:none}
  .jx-grid{grid-template-columns:1fr;align-items:start}
  .jx-pt{width:min(56%,200px)}
}
@media (prefers-reduced-motion: reduce){.st-program .jc,.st-program .j-nowline{animation:none}.jn-dot{animation:none}}

/* Bildwelt: Foto füllt die Zelle, Ausschnitt auf die Person (--fx/--fy, Zoom --z um --ox/--oy).
   Darüber genau eine Fläche aus dem Zeichensystem; sie trägt den Text. */
.ph{position:absolute;inset:0;overflow:hidden;z-index:0;background:var(--d3-black)}
.ph img,.k-hero .msk img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:var(--fx,50%) var(--fy,40%);transform:scale(var(--z,1.15));transform-origin:var(--ox,50%) var(--oy,40%)}
.geo{position:absolute;z-index:1;pointer-events:none;--r:min(92cqh,74cqw)}
.g-qbl{left:0;bottom:0;width:var(--r);height:var(--r);border-top-right-radius:100%;transform-origin:0% 100%}
.g-db{left:50%;bottom:0;width:calc(var(--r) * 2);height:var(--r);margin-left:calc(var(--r) * -1);border-radius:var(--r) var(--r) 0 0;transform-origin:50% 100%}
.g-dl{left:0;top:50%;width:var(--r);height:calc(var(--r) * 2);margin-top:calc(var(--r) * -1);border-radius:0 var(--r) var(--r) 0;transform-origin:0% 50%}
.k-hero .geo{--r:min(50cqw,56cqh);z-index:3}
.k-hero .L{z-index:4}
.k-hero .L .btm{max-width:calc(100% - 4px)}
.k-spkhead .geo{--r:min(96cqh,82cqw)}
.k-phead2 .geo{--r:min(94cqh,60cqw)}
.k-xhead .geo{--r:min(77cqh,82cqw)}
@container mod (max-height: 300px){ .k-xhead .geo{--r:min(94cqh,84cqw)} .k-phead2 .geo{--r:min(100cqh,70cqw)} }
.phw{position:absolute;top:0;right:0;bottom:0;width:44%;overflow:hidden;z-index:0}
.phw .geo{--r:40cqh}
.k-about .L{right:44%}
@container mod (aspect-ratio < 1.6){ .phw{display:none} .k-about .L{right:0} }
/* Tiefe: Bild gegen die Maus, Fläche und Text mit ihr */
.depth .ph img,.depth .k-hero .msk img{translate:calc(var(--mx) * -5px) calc(var(--my) * -5px)}
.depth .geo{translate:calc(var(--mx) * 2px) calc(var(--my) * 2px)}
/* Betreten: Bild öffnet sich, Fläche wächst aus ihrer Ecke; danach atmet sie in Stufen */
.st-explore .k-xhead .ph,.st-speaker .k-spkhead .ph,.st-partner .k-phead2 .ph,.st-partner .k-about .ph{animation:phIn .7s cubic-bezier(.7,0,.2,1) .2s both}
.st-explore .k-xhead .geo,.st-speaker .k-spkhead .geo,.st-partner .k-phead2 .geo,.st-partner .k-about .geo{animation:geoIn .6s cubic-bezier(.7,0,.2,1) .55s both,geoStep 12s cubic-bezier(.7,0,.2,1) 3s infinite}
.k-hero .geo{animation:geoStep 11s cubic-bezier(.7,0,.2,1) 5s infinite}

/* Weiter-/CTA-Pfeil: D-Staffel fährt beim Hover aus */
.s-arrow-w{display:block;width:clamp(26px,9cqw,44px);aspect-ratio:1;flex-shrink:0}
.mo-next{display:block;width:100%;height:100%;overflow:visible}
.mo-next path{fill:currentColor;transition:transform var(--motion-ui) var(--ease-out)}
.mod.act:hover .mo-next .p-b,.lnk:hover .mo-next .p-b{transform:translateX(9%)}
.mod.act:hover .mo-next .p-c,.lnk:hover .mo-next .p-c{transform:translateX(18%)}
/* Preloader */
.intro{position:absolute;inset:0;z-index:60;background:var(--d3-black);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .55s var(--ease-out) .1s,visibility 0s linear .7s}
.intro.out{opacity:0;visibility:hidden;pointer-events:none}
.intro.gone{display:none}
.ilogo{width:min(30vmin,240px);height:auto;overflow:visible;isolation:isolate}
.ip path{fill:var(--d3-bg);mix-blend-mode:difference;transform-box:view-box;transform-origin:50% 100%}
.ip .i0{animation:i0 .7s var(--ease-out) .15s both}
.ip .i1{animation:i1 .9s var(--ease-io) .45s both}
.ip .i2{animation:i2 .9s var(--ease-io) .7s both}
.ip{animation:ipOut .3s linear 1.6s both}
.ireal{fill:var(--d3-bg);opacity:0;animation:ipIn .3s linear 1.6s both}
@keyframes i0{from{transform:scaleX(0)}to{transform:none}}
@keyframes i1{from{transform:translateX(-62%) rotate(25deg);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}
@keyframes i2{from{transform:translateX(-124%) rotate(45deg);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}
@keyframes ipOut{to{opacity:0}}
@keyframes ipIn{to{opacity:1}}
/* Kacheln wachsen nach dem Preloader aus der linken oberen Ecke heraus */
.mod{transform-origin:0 0}
.booting .mod{opacity:0;transform:scale(.88);transition:none}
.booting .mo *{animation:none !important}
.booting .bar > *{opacity:0}
.bar > *{transition:opacity .5s var(--ease-out) .2s}
@media (prefers-reduced-motion: reduce){ .mo *,.ip *,.ip,.ireal{animation:none !important} .ip{opacity:0}.ireal{opacity:1} }
/* Amtshelden-Stimme: wie die Headlines auf amtshelden.de – fette Grotesk, Satzschreibung, Schlüsselwort in Grün */
.ah-claim{margin:0;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;font-size:clamp(20px,min(7cqw,13.5cqh),40px);line-height:1.08;letter-spacing:-.015em;text-wrap:balance;max-width:18ch}
.ah-claim span{color:var(--d3-green)}
.ah-sub{margin:0;font-size:clamp(14px,3.6cqw,17px);line-height:1.38;max-width:38ch;color:var(--d3-mute)}

/* Preloader: Marke baut sich auf, dann Schlagwörter im Takt, Auflösung in „Deep / Dive Day“ */
.ilock{display:flex;align-items:center;gap:clamp(16px,3vw,40px)}
.ilock .ilogo{width:min(22vmin,190px)}
.iwords{position:relative;width:min(56vw,620px);height:calc(var(--iws) * .92 * 2);--iws:clamp(30px,7vw,84px)}
.iw{position:absolute;left:0;top:0;display:flex;flex-direction:column;font-weight:850;font-stretch:108%;text-transform:uppercase;font-size:var(--iws);line-height:.92;letter-spacing:-.035em;color:var(--d3-bg);white-space:nowrap;clip-path:inset(100% 0 0 0)}
.iw b{font-weight:inherit}
.iw b + b{color:var(--d3-yellow)}
.iwf b + b{color:var(--d3-bg)}
.iw0{animation:iwStep .62s cubic-bezier(.7,0,.2,1) 1.45s both}
.iw1{animation:iwStep .62s cubic-bezier(.7,0,.2,1) 2.07s both}
.iw2{animation:iwStep .62s cubic-bezier(.7,0,.2,1) 2.69s both}
.iw3{animation:iwStep .62s cubic-bezier(.7,0,.2,1) 3.31s both}
.iwf{animation:iwIn .4s cubic-bezier(.7,0,.2,1) 3.93s both}
@keyframes iwStep{0%{clip-path:inset(100% 0 0 0)}22%,78%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 100% 0)}}
@keyframes iwIn{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
.intro.out .iwords{opacity:0;transition:opacity .3s}
@media (max-width:640px){.ilock{flex-direction:column;align-items:flex-start}.iwords{width:86vw}}
@media (prefers-reduced-motion: reduce){.iw{animation:none !important;clip-path:none}.iw:not(.iwf){display:none}}
/* Fließtext wie auf amtshelden.de: Georgia, linksbündig, mit Silbentrennung */
.p,.ah-sub,.faq p,.b-detail p,.eds p{font-family:var(--f-body);hyphens:auto;-webkit-hyphens:auto;letter-spacing:0}
.p{line-height:1.45}

/* 3D-Körper: Ruhezustand flach (SVG), Hover/erster Tap = WebGL-Körper, Material B */
.body3d{position:absolute;z-index:1;pointer-events:none}
.is3d .sh{visibility:hidden}
/* lists in modules */
.why ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:clamp(6px,2.4cqh,12px)}

.faq details{border-top:1px solid var(--d3-line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:16px;padding:12px 0;font-weight:800;font-size:clamp(15px,3.4cqw,19px);text-transform:uppercase;letter-spacing:-.01em}

@container mod (max-width: 520px){ .eds{grid-template-columns:minmax(0,1fr)} }

@container mod (max-width: 150px){ .hide-n{display:none !important} }
.grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:multiply;opacity:.14;z-index:30}

/* ===== Design-System-Board ===== */
.ds{background:var(--d3-bg);color:var(--d3-black);font-family:var(--f-text);--cell-padding:18px}
.lab{font-family:var(--f-sys);font-size:11px;letter-spacing:.05em;text-transform:uppercase;line-height:1.4}

.ds-sec{display:grid;grid-template-columns:270px minmax(0,1fr);border-bottom:1px solid var(--d3-black)}

.cap{margin:0;font-family:var(--f-body);font-size:14px;line-height:1.4;max-width:42ch}
code{font-family:var(--f-sys);font-size:12px}
.swrow{display:flex;height:220px}
.swrow.sm{height:96px;border-top:1px solid var(--d3-line)}
.sw{min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:16px 18px;box-shadow:inset -1px 0 0 var(--d3-line);overflow:hidden}

.sw.line{background-image:linear-gradient(var(--d3-line),var(--d3-line));background-size:100% 1px;background-position:0 60%;background-repeat:no-repeat}

<div class="ds-b"><div class="zrow"><div class="zc" style="background: var(--d3-black); color: var(--d3-bg)"><span class="lab">01</span><div class="zi"><svg class="mo mo-keynote " viewBox="0 0 100 100" aria-hidden="true"><path class="p-top" d="M0,50c0,-27.61424 22.38576,-50 50,-50c27.61424,0 50,22.38576 50,50h-20c0,-16.56854 -13.43146,-30 -30,-30c-16.56854,0 -30,13.43146 -30,30z"></path><path class="p-bot" d="M16,50c0,18.77768 15.22232,34 34,34c18.77768,0 34,-15.22232 34,-34h-16c0,9.94113 -8.05887,18 -18,18c-9.94113,0 -18,-8.05887 -18,-18z"></path><path class="p-kern" d="M32,50c0,-9.94113 8.05887,-18 18,-18c9.94113,0 18,8.05887 18,18z"></path></svg></div><div><b>Keynote & Vortrag</b><span class="lab" style="opacity: .7">Geteilter Ring, oben/unten invertiert</span></div></div><div class="zc" style="background: var(--d3-bg-2); color: var(--d3-black)"><span class="lab">02</span><div class="zi"><svg class="mo mo-case " viewBox="0 0 100 100" aria-hidden="true"><path class="p-star" d="M50,0l9.95,25.98l25.41,-11.34l-11.34,25.41l25.98,9.95l-25.98,9.95l11.34,25.41l-25.41,-11.34l-9.95,25.98l-9.95,-25.98l-25.41,11.34l11.34,-25.41l-25.98,-9.95l25.98,-9.95l-11.34,-25.41l25.41,11.34z"></path><path class="p-d" d="M50,84v-68c18.77768,0 34,15.22232 34,34c0,18.77768 -15.22232,34 -34,34z"></path></svg></div><div><b>Case & Panel</b><span class="lab" style="opacity: .7">Burst + D, Überlagerung negativ</span></div></div><div class="zc" style="background: var(--d3-white); color: var(--d3-black)"><span class="lab">03</span><div class="zi"><svg class="mo mo-master" viewBox="0 0 100 100" aria-hidden="true"><path class="p-ol" d="M0,33.5c36.45079,0 66,29.54921 66,66h-19c0,-25.95738 -21.04262,-47 -47,-47z"></path><path class="p-il" d="M0,65.5c18.77768,0 34,15.22232 34,34h-16c0,-9.94113 -8.05887,-18 -18,-18z"></path><path class="p-or" d="M100,33.5c-36.45079,0 -66,29.54921 -66,66h19c0,-25.95738 21.04262,-47 47,-47z"></path><path class="p-ir" d="M100,65.5c-18.77768,0 -34,15.22232 -34,34h16c0,-9.94113 8.05887,-18 18,-18z"></path><path class="p-cross" d="M50,56.41698c4.41417,5.11825 8.05579,10.92157 10.74376,17.22884c-4.89468,7.41695 -7.74376,16.30285 -7.74376,25.85418h-6c0,-9.55133 -2.84909,-18.43722 -7.74376,-25.85418c2.68797,-6.30728 6.3296,-12.11059 10.74376,-17.22884z"></path><g class="p-dots"><path class="p-d1" d="M43,7.5c0,3.86599 3.13401,7 7,7c3.86599,0 7,-3.13401 7,-7c0,-3.86599 -3.13401,-7 -7,-7c-3.86599,0 -7,3.13401 -7,7z"></path><path class="p-d2" d="M30.5,20c0,3.86599 3.13401,7 7,7c3.86599,0 7,-3.13401 7,-7c0,-3.86599 -3.13401,-7 -7,-7c-3.86599,0 -7,3.13401 -7,7z"></path><path class="p-d3" d="M55.5,20c0,3.86599 3.13401,7 7,7c3.86599,0 7,-3.13401 7,-7c0,-3.86599 -3.13401,-7 -7,-7c-3.86599,0 -7,3.13401 -7,7z"></path><path class="p-d4" d="M43,32.5c0,3.86599 3.13401,7 7,7c3.86599,0 7,-3.13401 7,-7c0,-3.86599 -3.13401,-7 -7,-7c-3.86599,0 -7,3.13401 -7,7z"></path></g></svg></div><div><b>Masterclass</b><span class="lab" style="opacity: .7">Vier Punkte über gekreuzten Bögen</span></div></div><div class="zc" style="background: var(--d3-yellow); color: var(--d3-black)"><span class="lab">04</span><div class="zi"><svg class="mo mo-net " viewBox="0 0 100 100" aria-hidden="true"><path class="p-a" d="M0,50c0,17.67311 14.32689,32 32,32c17.67311,0 32,-14.32689 32,-32c0,-17.67311 -14.32689,-32 -32,-32c-17.67311,0 -32,14.32689 -32,32z"></path><path class="p-b" d="M36,50c0,17.67311 14.32689,32 32,32c17.67311,0 32,-14.32689 32,-32c0,-17.67311 -14.32689,-32 -32,-32c-17.67311,0 -32,14.32689 -32,32z"></path><path class="p-lens" d="M64,50c0,10.9987 -5.54892,20.70137 -14,26.46128c-8.45108,-5.75991 -14,-15.46258 -14,-26.46128c0,-10.9987 5.54892,-20.70137 14,-26.46128c8.45108,5.75991 14,15.46258 14,26.46128z"></path></svg></div><div><b>Networking</b><span class="lab" style="opacity: .7">Zwei Kreise, Schnitt negativ</span></div></div><div class="zc" style="background: var(--d3-black); color: var(--d3-bg)"><span class="lab">05</span><div class="zi"><svg class="mo mo-expo " viewBox="0 0 100 100" aria-hidden="true"><path class="p-bowl" d="M100,49.5c0,11.38476 -3.80499,21.88082 -10.21265,30.28585c-4.85334,-17.41119 -20.82851,-30.18585 -39.78735,-30.18585c-18.95884,0 -34.93401,12.77466 -39.78735,30.18585c-6.40766,-8.40503 -10.21265,-18.90109 -10.21265,-30.28585z"></path><path class="p-dome" d="M50,68.8c13.46316,0 24.38999,10.85935 24.49917,24.29676c-7.24004,4.07728 -15.59798,6.40324 -24.49917,6.40324c-8.90119,0 -17.25913,-2.32596 -24.49917,-6.40324c0.10919,-13.4374 11.03601,-24.29676 24.49917,-24.29676z"></path><path class="p-head" d="M27.4,22.6c0,12.48164 10.11836,22.6 22.6,22.6c12.48164,0 22.6,-10.11836 22.6,-22.6c0,-12.48164 -10.11836,-22.6 -22.6,-22.6c-12.48164,0 -22.6,10.11836 -22.6,22.6z"></path></svg></div><div><b>Stände</b><span class="lab" style="opacity: .7">Kopf über einer Schale</span></div></div><div class="zc nx" style="background: var(--d3-white); color: var(--d3-black)"><span class="lab">06</span><div class="zi"><svg class="mo-next" viewBox="0 0 100 100" aria-hidden="true"><path class="p-a" d="M0,10c22.09139,0 40,17.90861 40,40c0,22.09139 -17.90861,40 -40,40z"></path><path class="p-b" d="M30,10c22.09139,0 40,17.90861 40,40c0,22.09139 -17.90861,40 -40,40z"></path><path class="p-c" d="M60,10c22.09139,0 40,17.90861 40,40c0,22.09139 -17.90861,40 -40,40z"></path></svg></div><div><b>Weiter</b><span class="lab" style="opacity: .7">Drei Halbkreise – fahren bei Hover aus</span></div></div></div>
<div class="zsmall"><span class="lab">UI-Größe · ab 16 px · flache Masken</span><div class="zsr"><span class="zs"><span class="sh s-circle"></span></span><span class="zs"><span class="sh s-burst"></span></span><span class="zs"><span class="sh s-diag"></span></span><span class="zs"><span class="sh s-net"></span></span><span class="zs"><span class="sh s-grid"></span></span><span class="zs"><span class="sh s-arrow"></span></span></div><div class="zsr big2"><span class="zs"><span class="sh s-circle"></span></span><span class="zs"><span class="sh s-burst"></span></span><span class="zs"><span class="sh s-diag"></span></span><span class="zs"><span class="sh s-net"></span></span><span class="zs"><span class="sh s-grid"></span></span><span class="zs"><span class="sh s-arrow"></span></span></div></div>
<ul class="rules">
<li><b>Ein Zeichen = ein Format.</b> Alle Zeichen sind aus der Bildmarke gebaut: Halbkreise, Kreise, Bögen. Echte Boolesche Flächen, keine Konturen, keine Verläufe.</li>
<li><b>Ruhezustand:</b> Teile bauen sich beim Laden auf und laufen dann in gerasterten Schritten (siehe Motion).</li>
</ul></div>
</section>
<section class="ds-sec">
<header class="ds-h"><span class="lab">04</span><h2 class="ds-t">Typografie</h2><p class="ds-lead">Grotesk für die Ansage, Serife zum Lesen, Mono für Ordnung.</p></header>
<div class="ds-b"><div class="trow"><span class="lab">Display · Archivo 850 · 108 %</span><div style="justify-self: start; background: var(--d3-black); padding: 18px 26px 14px"><div class="d3type" style="font-size: 150px" aria-label="D3"><span>D</span><span>3</span></div></div></div>
<div class="trow"><span class="lab">Headline · Archivo 850 · 108 % · Versal</span><div class="big" style="font-size: 64px">Deep Dive Day</div></div>
<div class="trow"><span class="lab">Aussage · Archivo 800 · Satzschreibung · Schlüsselwort grün</span><p class="ah-claim" style="font-size: 40px; max-width: 20ch">Die digitale Konferenz <span>für Behörden</span>, die neue Wege gehen.</p></div>
<div class="trow"><span class="lab">Fließtext · Georgia · linksbündig · Silbentrennung</span><p class="p" style="font-family: var(--f-body); hyphens: auto; font-size: 18px; max-width: 52ch">Ein Tag im Browser – Keynotes, Cases, Masterclasses und Austausch. Wie auf amtshelden.de: die Serife trägt den Lesetext, die Grotesk die Ansage.</p></div>
<div class="trow"><span class="lab">Zeit · Archivo 850 · Ziffern tabellarisch</span><div style="font-weight: 850; font-stretch: 108%; font-size: 64px; letter-spacing: -.03em; line-height: .9; font-variant-numeric: tabular-nums">09:40</div></div>
<div class="trow"><span class="lab">Label · Martian Mono 400 · 11 px · Versal</span><span class="sys" style="font-size: 13px">D3 · Ausgabe 01 · Main Stage</span></div>
<ul class="rules">
<li><b>Variante C:</b> Archivo für Headlines und UI, Georgia für Fließtext, Martian Mono für Labels. Keine weiteren Schnitte.</li>
<li><b>Offen:</b> Umlaute in Versal-Headlines (Ä, Ö, Ü stoßen an die Zeile darüber). Vorschlag: lange Ansagen in Satzschreibung.</li>
</ul></div>
</section>
<section class="ds-sec">
<header class="ds-h"><span class="lab">05</span><h2 class="ds-t">Raster & Module</h2><p class="ds-lead">Das Interface ist ein Raster aus Zellen. Text sitzt oben oder unten, nie in der Mitte.</p></header>
<div class="ds-b"><div class="dmrow"><div class="mod dm" style="background: var(--d3-green); color: var(--d3-white)"><i class="g gt"></i><i class="g gb"></i><i class="g gl"></i><div class="tA pad" style="height: 100%; box-sizing: border-box"><span class="lab">Thema · Ausgabe 01</span><div class="btm"><div class="big" style="font-size: 26px">KI +<br>Transformation</div></div></div></div><div class="mod dm" style="background: var(--d3-black); color: var(--d3-bg)"><i class="g gt"></i><i class="g gb"></i><i class="g gl"></i><div class="tA pad" style="height: 100%; box-sizing: border-box"><span class="lab">Keynote · Main Stage</span><div class="btm"><div style="font-weight: 850; font-stretch: 108%; font-size: 40px; line-height: .9">09:40</div><span class="lab">Vortrag ansehen</span></div></div><div class="dm-ic" style="color: var(--d3-orange)"><svg class="mo mo-keynote " viewBox="0 0 100 100" aria-hidden="true"><path class="p-top" d="M0,50c0,-27.61424 22.38576,-50 50,-50c27.61424,0 50,22.38576 50,50h-20c0,-16.56854 -13.43146,-30 -30,-30c-16.56854,0 -30,13.43146 -30,30z"></path><path class="p-bot" d="M16,50c0,18.77768 15.22232,34 34,34c18.77768,0 34,-15.22232 34,-34h-16c0,9.94113 -8.05887,18 -18,18c-9.94113,0 -18,-8.05887 -18,-18z"></path><path class="p-kern" d="M32,50c0,-9.94113 8.05887,-18 18,-18c9.94113,0 18,8.05887 18,18z"></path></svg></div></div><div class="mod dm" style="background: var(--d3-yellow); color: var(--d3-black)"><i class="g gt"></i><i class="g gb"></i><i class="g gl"></i><div class="tA pad" style="height: 100%; box-sizing: border-box"><span class="lab">Mitmachen</span><div class="btm"><div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; width: 100%"><div class="big" style="font-size: 34px">Partner<br>werden</div><span style="width: 44px; height: 44px; display: block"><svg class="mo-next" viewBox="0 0 100 100" aria-hidden="true"><path class="p-a" d="M0,10c22.09139,0 40,17.90861 40,40c0,22.09139 -17.90861,40 -40,40z"></path><path class="p-b" d="M30,10c22.09139,0 40,17.90861 40,40c0,22.09139 -17.90861,40 -40,40z"></path><path class="p-c" d="M60,10c22.09139,0 40,17.90861 40,40c0,22.09139 -17.90861,40 -40,40z"></path></svg></span></div></div></div></div><div class="mod dm" style="background: var(--d3-white); color: var(--d3-black)"><i class="g gt"></i><i class="g gb"></i><i class="g gl"></i><div class="tA pad" style="height: 100%; box-sizing: border-box"><span class="lab">Was ist D3?</span><div class="btm"><p class="ah-claim" style="font-size: 26px">Die digitale Konferenz <span>für Behörden</span>, die neue Wege gehen.</p></div></div></div></div>
<div class="tok">
<div><code>--cell-padding</code><span class="lab">18 Desktop · 16 Tablet · 12 Mobil</span></div>
<div><code>--label-position</code><span class="lab">= cell-padding von oben</span></div>
<div><code>--content-baseline</code><span class="lab">= cell-padding von unten</span></div>
<div><code>--meta-baseline</code><span class="lab">cell-padding + 2 px</span></div>
</div>
<ul class="rules">
<li><b>Raster:</b> 12 Spalten Desktop, 8 Tablet, 4 Mobil. Zellen stoßen bündig aneinander, Linien in Tinte 14 %.</li>
<li><b>Text dockt an:</b> Label oben, Inhalt unten – nie mittig (rote Hilfslinien). Eine Zelle, eine Botschaft.</li>
</ul></div>
</section>
<section class="ds-sec">
<header class="ds-h"><span class="lab">06</span><h2 class="ds-t">Bildwelt</h2><p class="ds-lead">Menschen in einer gebauten Raumlandschaft aus unseren Farben und Formen. Darüber immer genau eine Fläche aus dem Zeichensystem.</p></header>
<div class="ds-b"><div class="bwrow"><div class="bwc"><div class="mod bwm" style="color: var(--d3-black)"><div class="ph"><img src="/bildwelt/d3-connection.jpg" alt="" style="--fx: 92%; --fy: 40%; --z: 1.1; --ox: 72%; --oy: 40%"></div><span class="geo g-qbl" style="background: var(--d3-bg)"></span><div class="bwt"><div class="big" style="font-size: 26px">Ein Tag.<br>Viele Räume.</div></div></div><span class="lab">Viertelkreis · Bone · trägt die Headline</span></div><div class="bwc"><div class="mod bwm" style="color: var(--d3-bg)"><div class="ph"><img src="/bildwelt/d3-speaker.jpg" alt="" style="--fx: 6%; --fy: 22%; --z: 1.2; --ox: 66%; --oy: 26%"></div><span class="geo g-qbl" style="background: var(--d3-black)"></span><div class="bwt"><div class="big" style="font-size: 24px">Speaker*innen</div></div></div><span class="lab">Viertelkreis · Tinte</span></div><div class="bwc"><div class="mod bwm" style="color: var(--d3-black)"><div class="ph"><img src="/bildwelt/d3-moment.jpg" alt="" style="--fx: 50%; --fy: 34%; --z: 1.3; --ox: 50%; --oy: 36%"></div><span class="geo g-db" style="background: var(--d3-yellow)"></span><div class="bwt"><span class="lab">09:40 · Keynote</span><b style="display: block; font-size: 16px">Vortrag ansehen</b></div></div><span class="lab">Halbkreis · Gelb · Porträt-Zelle</span></div><div class="bwc"><div class="mod bwm" style="color: var(--d3-black)"><div class="ph"><img src="/bildwelt/d3-space.jpg" alt="" style="--fx: 60%; --fy: 28%; --z: 1.15; --ox: 65%; --oy: 30%"></div><span class="geo g-qbl" style="background: var(--d3-yellow)"></span><div class="bwt"><div class="big" style="font-size: 26px">Mitmachen</div></div></div><span class="lab">Viertelkreis · Gelb</span></div></div><ul class="rules">
<li><b>Ausschnitt auf die Person.</b> Das Foto füllt die Zelle; Fokus und Zoom sitzen auf Gesicht und Haltung, nie das ganze Motiv als Postkarte.</li>
<li><b>Eine Fläche pro Bild.</b> Viertel- oder Halbkreis aus dem Zeichensystem, an einer Zellkante verankert. Die Fläche trägt den Text – nie Text direkt aufs Foto.</li>
<li><b>Farbe bleibt.</b> Die Motive sind in Tinte, Bone, Gelb und Grün gebaut, deshalb farbig. Speaker*innen-Porträts bleiben schwarzweiß.</li>
<li><b>Bewegung:</b> Beim Betreten öffnet sich das Bild, die Fläche wächst aus ihrer Ecke und atmet danach in Stufen. Maus: Bild −5 px, Fläche +2 px.</li>
</ul></div>
</section>
<section class="ds-sec">
<header class="ds-h"><span class="lab">07</span><h2 class="ds-t">Motion</h2><p class="ds-lead">Gerastert statt geschmeidig: Schritt, Halt, Schritt. Abgeleitet aus dem 9-Square- und dem Poster-Raster.</p></header>
<div class="ds-b"><div class="mrow">
<div class="mc"><span class="lab">01 · Stufe</span><div class="ms"><div class="mgrid"></div><div class="m-step"></div></div><p class="cap">Bewegung 18 % der Zeit, dann Halt. Rotation nur in 22,5°/90°-Schritten.</p></div>
<div class="mc"><span class="lab">02 · D-Wischer</span><div class="ms m-wipe"><span class="w1"></span><span class="w2"></span><span class="w3"></span></div><p class="cap">Ein Halbkreis wächst von der Kante und bringt die nächste Farbe.</p></div>
<div class="mc"><span class="lab">03 · Aufklappen</span><div class="ms"><div class="mgrid"></div><div class="m-exp"></div></div><p class="cap">Ein Inhalt wächst aus seiner Zelle auf die Fläche und fällt dorthin zurück.</p></div>
<div class="mc"><span class="lab">04 · Aufbau</span><div class="ms"><div class="m-build"><i style="--i: 0"></i><i style="--i: 1"></i><i style="--i: 2"></i><i style="--i: 3"></i><i style="--i: 4"></i><i style="--i: 5"></i><i style="--i: 6"></i><i style="--i: 7"></i><i style="--i: 8"></i><i style="--i: 9"></i><i style="--i: 10"></i><i style="--i: 11"></i></div></div><p class="cap">Beim Laden und Zustandswechsel bauen sich Zellen von links oben auf.</p></div>

/* Minimaler Renderer für das .dc.html-Template-Format (Holes, sc-for, sc-if) auf React. */
(function(){
  var h=React.createElement;
  var EV={onclick:'onClick',onmouseenter:'onMouseEnter',onmouseleave:'onMouseLeave',onwheel:'onWheel',onmousemove:'onMouseMove',onsubmit:'onSubmit',ontouchstart:'onTouchStart',ontouchend:'onTouchEnd',onchange:'onChange',oninput:'onInput'};
  var KEEP=/^(aria-|data-)/;
  function camel(s){return s.replace(/-([a-z])/g,function(m,c){return c.toUpperCase();});}
  function lookup(path,scope){
    path=path.trim();
    if(path==='true')return true; if(path==='false')return false; if(path==='null')return null;
    if(/^-?\d+(\.\d+)?$/.test(path))return parseFloat(path);
    if(/^'.*'$/.test(path))return path.slice(1,-1);
    var parts=path.split('.'),v=scope;
    for(var i=0;i<parts.length;i++){ if(v==null)return undefined; v=v[parts[i]]; }
    return v;
  }
  var HOLE=/\{\{\s*([^}]+?)\s*\}\}/g, WHOLE=/^\{\{\s*([^}]+?)\s*\}\}$/;
  function interp(str,scope){ return str.replace(HOLE,function(m,p){var v=lookup(p,scope);return v==null?'':String(v);}); }
  function val(str,scope){ var m=str.match(WHOLE); return m?lookup(m[1],scope):interp(str,scope); }
  function styleObj(s){
    var o={}; s.split(';').forEach(function(d){ var i=d.indexOf(':'); if(i<0)return; var k=d.slice(0,i).trim(), v=d.slice(i+1).trim(); if(!k)return; o[k.indexOf('--')===0?k:camel(k)]=v; }); return o;
  }
  function props(el,scope,key){
    var p={key:key}, svg=el.namespaceURI==='http://www.w3.org/2000/svg';
    for(var i=0;i<el.attributes.length;i++){
      var a=el.attributes[i], n=a.name, raw=a.value;
      if(n==='class'){p.className=interp(raw,scope).replace(/\s+/g,' ').trim();continue;}
      if(n==='for'){p.htmlFor=interp(raw,scope);continue;}
      if(n==='style'){p.style=styleObj(interp(raw,scope));continue;}
      if(EV[n]){var f=val(raw,scope); if(typeof f==='function')p[EV[n]]=f; continue;}
      if(n==='ref'){var r=val(raw,scope); if(r)p.ref=r; continue;}
      var v=val(raw,scope);
      if(KEEP.test(n)){p[n]=(typeof v==='boolean')?String(v):v;continue;}
      if(svg&&n.indexOf('-')>0)n=camel(n);
      if(n==='tabindex')n='tabIndex'; if(n==='readonly')n='readOnly'; if(n==='maxlength')n='maxLength';
      p[n]=v;
    }
    return p;
  }
  function kids(node,scope){
    var out=[],cs=node.childNodes;
    for(var i=0;i<cs.length;i++){var r=render(cs[i],scope,i); if(r==null)continue; if(Array.isArray(r))out.push.apply(out,r); else out.push(r);}
    return out;
  }
  function render(n,scope,key){
    if(n.nodeType===3){ var t=n.nodeValue; if(!t.trim())return null; return interp(t,scope); }
    if(n.nodeType!==1)return null;
    var tag=n.localName;
    if(tag==='sc-for'){
      var list=val(n.getAttribute('list'),scope)||[], as=n.getAttribute('as')||'item';
      return list.map(function(it,ix){ var s=Object.create(scope); s[as]=it; s.$index=ix; return h(React.Fragment,{key:key+'_'+ix},kids(n,s)); });
    }
    if(tag==='sc-if'){ return val(n.getAttribute('value'),scope)?h(React.Fragment,{key:key},kids(n,scope)):null; }
    var tagName=n.namespaceURI==='http://www.w3.org/2000/svg'?n.tagName:tag;
    var c=kids(n,scope);
    return h.apply(null,[tagName,props(n,scope,key)].concat(c.length?c:[]));
  }
  var root=document.importNode(document.getElementById('tpl').content,true);
  window.DCLogic=class extends React.Component{
    render(){ var v=this.renderVals?this.renderVals():{}; return h(React.Fragment,null,kids(root,v)); }
  };
  window.__DC_MOUNT__=function(C){
    ReactDOM.createRoot(document.getElementById('root')).render(h(C,window.__DC_DEFAULTS__||{}));
  };
})();

</script>
